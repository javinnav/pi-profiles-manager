<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">PiProfiles profile editor</title>
  <desc id="desc">A terminal-style rendering of the captured PiProfiles edit profile TUI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a33"/>
      <stop offset="1" stop-color="#090d19"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="960" height="560" fill="#070a12"/>
  <rect x="32" y="28" width="896" height="504" rx="14" fill="url(#bg)" stroke="#334160" stroke-width="2" filter="url(#shadow)"/>
  <rect x="32" y="28" width="896" height="48" rx="14" fill="#18223d"/>
  <rect x="32" y="62" width="896" height="14" fill="#18223d"/>
  <circle cx="62" cy="52" r="7" fill="#ff6b7a"/>
  <circle cx="86" cy="52" r="7" fill="#ffc857"/>
  <circle cx="110" cy="52" r="7" fill="#5de4a8"/>
  <text x="480" y="57" text-anchor="middle" fill="#a9b7d4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">pi · Profiles Manager</text>
  <rect x="74" y="105" width="812" height="370" rx="8" fill="#0d1426" stroke="#293653"/>
  <rect x="74" y="105" width="812" height="54" rx="8" fill="#111c35"/>
  <text x="105" y="140" fill="#8df0c0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">Edit Profile 'Balanced'</text>
  <line x1="105" y1="177" x2="855" y2="177" stroke="#293653"/>
  <rect x="96" y="194" width="768" height="48" rx="6" fill="#1d3150" stroke="#4e709e"/>
  <rect x="96" y="194" width="5" height="48" rx="2" fill="#8df0c0"/>
  <text x="122" y="225" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">orchestrator — openai/gpt-5 (high)</text>
  <text x="122" y="274" fill="#e6edf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">gentle-ai-explore — none (medium)</text>
  <text x="122" y="323" fill="#e6edf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">gentle-ai-worker — none (high)</text>
  <line x1="105" y1="346" x2="855" y2="346" stroke="#293653"/>
  <text x="122" y="379" fill="#e6edf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">✎ Change selected subagents' models</text>
  <text x="122" y="414" fill="#e6edf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">✎ Change selected subagents' thinking</text>
  <text x="122" y="449" fill="#e6edf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">➕ Add Subagent</text>
  <text x="765" y="449" fill="#91a2c3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">← Back</text>
  <text x="105" y="492" fill="#7082a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">PiProfiles · captured Pi TUI</text>
</svg>
