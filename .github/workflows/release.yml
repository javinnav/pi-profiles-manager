name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Verify annotated tag and package version
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF")" = "tag"
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Install dependencies
        run: npm ci
      - name: Build the package
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Check package contents
        run: npm run package-check
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
      - name: Publish to NPM
        run: npm publish --provenance --access public
