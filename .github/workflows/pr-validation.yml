name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

permissions:
  issues: read
  pull-requests: read

jobs:
  contribution-requirements:
    name: Contribution Requirements
    runs-on: ubuntu-latest
    steps:
      - name: Validate linked issue and change type
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? '';
            const issuePattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;
            const issueNumbers = [...body.matchAll(issuePattern)].map((match) => Number(match[1]));

            if (issueNumbers.length === 0) {
              core.setFailed('The pull request body must link an issue using a closing keyword, for example: Closes #123.');
              return;
            }

            const uniqueIssueNumbers = [...new Set(issueNumbers)];
            const issues = await Promise.all(uniqueIssueNumbers.map(async (issue_number) => {
              const { data } = await github.rest.issues.get({
                ...context.repo,
                issue_number,
              });
              return data;
            }));

            const pullRequestReferences = issues.filter((issue) => issue.pull_request);
            if (pullRequestReferences.length > 0) {
              const pullRequestList = pullRequestReferences.map((issue) => `#${issue.number}`).join(', ');
              core.setFailed(`Closing references must link to issues, not pull requests: ${pullRequestList}.`);
              return;
            }

            const unapprovedIssues = issues.filter((issue) =>
              !issue.labels.some((label) =>
                (typeof label === 'string' ? label : label.name) === 'status:approved',
              ),
            );

            if (unapprovedIssues.length > 0) {
              const issueList = unapprovedIssues.map((issue) => `#${issue.number}`).join(', ');
              core.setFailed(`Linked issue(s) must have the status:approved label: ${issueList}.`);
              return;
            }

            const typeLabels = context.payload.pull_request.labels.filter((label) => label.name.startsWith('type:'));
            if (typeLabels.length !== 1) {
              core.setFailed(`The pull request must have exactly one label beginning with type:. Found: ${typeLabels.map((label) => label.name).join(', ') || 'none'}.`);
            }
