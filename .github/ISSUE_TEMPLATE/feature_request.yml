name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels:
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing your idea.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user need or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or outcome you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative approaches.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or other supporting information.
